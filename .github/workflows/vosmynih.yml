# Builds the macOS (Apple Silicon + Intel) DMGs and the Windows installer in the cloud.
# Installed as .github/workflows/vosmynih.yml. Push a tag "vosmynih-v*" to build and attach the
# installers to a GitHub Release, or start it by hand (Actions > vosmynih > Run workflow) for build artifacts only.
name: vosmynih
on:
  workflow_dispatch:
  push:
    tags: ["vosmynih-v*"]
jobs:
  macos:
    strategy:
      matrix:
        runner: [macos-14, macos-15-intel]    # arm64, x86_64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: ./build/build_macos.sh python
      - uses: actions/upload-artifact@v4
        with: { name: "vosmynih-${{ matrix.runner }}", path: "dist/*.dmg" }
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: choco install innosetup -y --no-progress
      - run: powershell -ExecutionPolicy Bypass -File build\build_windows.ps1
      - uses: actions/upload-artifact@v4
        with: { name: vosmynih-windows, path: "dist/*-windows-x64*" }
  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [macos, windows]
    runs-on: ubuntu-latest
    permissions: { contents: write }
    steps:
      - uses: actions/download-artifact@v4
        with: { path: dist, merge-multiple: true }
      - uses: softprops/action-gh-release@v2
        with: { files: "dist/*" }
